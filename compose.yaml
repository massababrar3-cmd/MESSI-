services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: messi
      POSTGRES_DB: messi
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Generate .local/compose.env first}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messi -d messi"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://messi:${DB_PASSWORD}@database:5432/messi
      MESSI_ORIGINS: ${MESSI_ORIGINS:-http://127.0.0.1:8000}
      MESSI_SECURE_COOKIES: ${MESSI_SECURE_COOKIES:-0}
      API_HOST: 0.0.0.0
    ports: ["127.0.0.1:${MESSI_HTTP_PORT:-8000}:8000"]
    volumes: ["pilot-data:/data"]
    restart: unless-stopped
volumes:
  postgres-data:
  pilot-data:
